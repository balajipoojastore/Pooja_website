<!doctype html>
<html lang="en">
  <body style="margin:0;background:#fff8f1;font-family:Arial,sans-serif;color:#1f2937">
    <div style="max-width:560px;margin:0 auto;padding:32px 20px">
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:32px;text-align:center">
        <p style="margin:0 0 8px;color:#ea580c;font-size:13px;font-weight:700;letter-spacing:.08em">THE POOJA HOUSE</p>
        <h1 style="margin:0 0 16px;font-size:24px">Verify your email</h1>
        <p style="margin:0 0 20px;color:#64748b">Your six-digit verification code is:</p>
        <div style="margin:0 auto 20px;padding:16px;border-radius:12px;background:#fff1e6;color:#1f2937;font-size:32px;font-weight:700;letter-spacing:.2em">{{ .Token }}</div>
        <p style="margin:0;color:#64748b;font-size:14px">This code is temporary. Do not share it with anyone.</p>
      </div>
    </div>
  </body>
</html>
